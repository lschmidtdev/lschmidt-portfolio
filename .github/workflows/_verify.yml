name: Verify

on:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA recorded in build-info.json
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Content guard
        run: dart run tool/ci/content_guard.dart
      - name: Test
        run: flutter test
      - name: Build web (wasm)
        run: flutter build web --release --wasm
      - name: Generate HTML shells
        run: dart run tool/web/build_shell.dart
      - name: Write build-info.json
        run: dart run tool/ci/build_info.dart
        env:
          BUILD_SHA: ${{ inputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tool/e2e/.nvmrc
          cache: npm
          cache-dependency-path: tool/e2e/package-lock.json
      - name: Install browser test dependencies
        working-directory: tool/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tool/e2e/package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tool/e2e
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chromium system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: tool/e2e
        run: npx playwright install-deps chromium
      - name: Browser tests
        working-directory: tool/e2e
        run: npx playwright test
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tool/e2e/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
          retention-days: 30
