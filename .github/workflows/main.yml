name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml
    with:
      sha: ${{ github.sha }}

  deploy-live:
    name: deploy-live
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: live
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA is no longer the tip of main ($tip); skipping deploy, the newer commit will deploy"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tip.outputs.current == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.tip.outputs.current == 'true'
        with:
          name: web-build
          path: build/web
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.tip.outputs.current == 'true'
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
        if: steps.tip.outputs.current == 'true'
      - name: Compile smoke test
        if: steps.tip.outputs.current == 'true'
        run: dart compile exe tool/ci/smoke.dart -o "$RUNNER_TEMP/smoke"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tip.outputs.current == 'true'
        with:
          node-version-file: tool/e2e/.nvmrc
          cache: npm
          cache-dependency-path: tool/e2e/package-lock.json
      - name: Install Firebase CLI (locked)
        if: steps.tip.outputs.current == 'true'
        working-directory: tool/e2e
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.tip.outputs.current == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Deploy and smoke test
        if: steps.tip.outputs.current == 'true'
        env:
          DEPLOY_CHANNEL: ${{ vars.DEPLOY_CHANNEL }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          case "$DEPLOY_CHANNEL" in
            live) tool/e2e/node_modules/.bin/firebase deploy --only hosting:site --project "$FIREBASE_PROJECT" --non-interactive --message "$GITHUB_SHA"
                  url="$SITE_URL"
                  expect=--expect-indexable ;;
            next) tool/e2e/node_modules/.bin/firebase hosting:channel:deploy next --only site --project "$FIREBASE_PROJECT" --expires 30d --json > deploy.json
                  url=$(jq -r '.result | to_entries[0].value.url' deploy.json)
                  expect=--expect-noindex ;;
            *) echo "::error::DEPLOY_CHANNEL must be next or live (got '$DEPLOY_CHANNEL')"; exit 1 ;;
          esac
          "$RUNNER_TEMP/smoke" "$url" "$GITHUB_SHA" "$expect"
