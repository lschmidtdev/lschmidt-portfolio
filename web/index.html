<!DOCTYPE html>

<head>

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <title>%%title%%</title>
  <meta name="description" content="%%description%%">
  <link rel="canonical" href="%%canonical%%">
  <link rel="alternate" hreflang="en" href="%%urlEn%%">
  <link rel="alternate" hreflang="pt-BR" href="%%urlPt%%">
  <link rel="alternate" hreflang="x-default" href="%%urlEn%%">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lucas Schmidt">
  <meta property="og:title" content="%%title%%">
  <meta property="og:description" content="%%description%%">
  <meta property="og:url" content="%%canonical%%">
  <meta property="og:image" content="%%ogImage%%">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:image:alt" content="%%ogImageAlt%%">
  <meta name="theme-color" content="#0B0C0E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lucas Schmidt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <script type="application/ld+json">%%jsonLd%%</script>
  %%analytics%%
  <style>
    html,body{margin:0;background:#0B0C0E;color:#E9EAEC;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    #splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2;display:flex;align-items:center;justify-content:center;background:#0B0C0E}
    #splash span{width:32px;height:32px;border:2px solid #6FB1E8;border-radius:50%;animation:ls-pulse 1.6s ease-in-out infinite}
    @keyframes ls-pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){#splash span{animation:none}}
    .fallback{max-width:720px;margin:0 auto;padding:24px 16px;line-height:1.6}
    .fallback p{color:#A3A8AF}
    .fallback h1{color:#E9EAEC}
    .fallback a{color:#6FB1E8}
  </style>
  <noscript><style>#splash{display:none}</style></noscript>
</head>
<body>
  <div id="splash" aria-hidden="true"><span></span></div>
  <script>
    (function () {
      var GOOD = 'width=device-width, initial-scale=1';
      function fix() {
        var metas = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          var c = metas[i].getAttribute('content') || '';
          if ((c.indexOf('user-scalable=no') !== -1 ||
              c.indexOf('maximum-scale') !== -1) && c !== GOOD) {
            metas[i].setAttribute('content', GOOD);
          }
        }
      }
      fix();
      new MutationObserver(fix).observe(document.head, {
        childList: true, subtree: true,
        attributes: true, attributeFilter: ['content']
      });
    })();
  </script>
  <script>
    (function () {
      var done = false;
      var root = document.documentElement;
      if (document.getElementById('splash')) root.style.overflow = 'hidden';
      function reveal() {
        if (done) return;
        done = true;
        root.style.overflow = '';
        ['#splash', 'main.fallback'].forEach(function (selector) {
          var el = document.querySelector(selector);
          if (el) el.remove();
        });
      }
      window.addEventListener('flutter-first-frame', reveal);
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s) s.remove();
        root.style.overflow = '';
      }, 10000);
    })();
  </script>
  %%fallback%%
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
