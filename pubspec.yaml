name: lschmidt_portfolio
description: "Lucas Schmidt's portfolio website (lschmidt.tech)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.0
  flutter: 3.41.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: ^0.20.2
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  alchemist: ^0.14.1
  bloc_test: ^10.0.0
  crypto: ^3.0.7
  yaml: ^3.1.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
  fonts:
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/InterTight-Regular.ttf
        - asset: assets/fonts/InterTight-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterTight-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
